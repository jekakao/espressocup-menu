/* ── Task 2.1: CSS custom properties ─────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Inter:wght@400;600&display=swap');

:root {
  --bg:           ${n};
  --surface:      ${r};
  --panel:        ${i};
  --border:       ${a};
  --gold:         ${o};
  --goldLight:    ${s};
  --cream:        ${c};
  --text:         ${l};
  --muted:        ${u};
  --fs-item-name:      ${d}vw;
  --fs-item-note:      ${f}vw;
  --fs-price:          ${p}vw;
  --fs-hdr-title:      ${m}vw;
  --fs-hdr-sub:        ${h}vw;
  --fs-badge-star:     ${g}vw;
  --fs-badge-new:      ${_}vw;
  --fs-badge-featured:  ${v}vw;
  --fs-badge-campaign:  ${y}vw;
  --fs-page-date:       ${b}vw;
  --fs-info-story:      ${x}vw;
  --fs-info-social:     ${ee}vw;
}

/* ── Task 2.2: Reset & base ───────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
}

/* Font-stack fallbacks (FR-65) — used when Google Fonts is unavailable */
body {
  font-family: 'Inter', Arial, 'Helvetica Neue', sans-serif;
  color: var(--text);
}

.playfair {
  font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
}

/* ── Task 2.3: Top bar ────────────────────────────────────────────────────── */
.tb {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 6.5vh;
  padding: 0 2vw;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.tb-logo {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 3.5vw;
  font-weight: 700;
  color: var(--goldLight);
  letter-spacing: 0.02em;
}

.tb-title {
  flex: 1;
  text-align: center;
  font-size: 1.8vw;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

.tb-right {
  display: flex;
  align-items: center;
  gap: 0.8vw;
}

.tv-tag {
  font-size: 1.3vw;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--gold);
  padding: 0.25em 0.7em;
  border-radius: 2px;
}

/* ── v3.0: Left brand strip ───────────────────────────────────────────────── */
.lp {
  position: relative;
  width: 10vw;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

/* Vertical brand accent text — "JUST ESPRESSO" filling the full strip height */
.lp-brand {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 8vw;
  line-height: 1;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2vw;
  color: var(--gold);
  opacity: 0.25;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  user-select: none;
  pointer-events: none;
}

/* ── v3.0: Right panel & header ───────────────────────────────────────────── */
.rp {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 2.0vh 3.5vw;
  overflow: hidden;
}

/* Right panel header — label, title, subtitle, date */
.rh {
  display: flex;
  flex-direction: column;
  padding-bottom: 1.0vh;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.0vh;
}

.rh-label {
  font-size: 2.0vw;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
}

.rh-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: var(--fs-hdr-title);
  font-style: italic;
  font-weight: 700;
  color: var(--cream);
  line-height: 1.0;
  margin: 0.3vh 0;
}

.rh-sub {
  font-size: var(--fs-hdr-sub);
  color: var(--muted);
  line-height: 1.2;
}

.rh-date {
  font-size: 1.0vw;
  color: var(--muted);
  font-style: italic;
  margin-top: 0.8vh;
}

.page-date {
  text-align: right;
  font-size: var(--fs-page-date);
  color: var(--muted);
  font-style: italic;
  padding-top: 1.2vh;
}

/* Size header rows */
.sh3, .sh2, .sh1 {
  display: grid;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.8vh;
  margin-bottom: 1.2vh;
  font-size: 1.5vw;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.sh3 { grid-template-columns: 3fr 1fr 1fr 1fr; }
.sh2 { grid-template-columns: 3fr 1fr 1fr; }
.sh1 { grid-template-columns: 3fr 1fr; }

/* Price-column header spans centered over their price column */
.sh3 span:not(:first-child),
.sh2 span:not(:first-child) { text-align: center; }
/* Single-price column: right-align to match .ip.r prices */
.sh1 span:not(:first-child) { text-align: right; }

/* Item column container — single column in v3.0 */
.ig {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

.ic {
  display: flex;
  flex-direction: column;
}

/* ── Task 2.6: Item row styles ────────────────────────────────────────────── */
.r3, .r2, .r1 {
  display: grid;
  align-items: center;
  padding: 0.45vh 0;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
}

.r3 { grid-template-columns: 3fr 1fr 1fr 1fr; }
.r2 { grid-template-columns: 3fr 1fr 1fr; }
.r1 { grid-template-columns: 3fr 1fr; }

/* Name+note wrapper cell — keeps both on same grid column */
.in-cell {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  overflow: hidden;
  padding-right: 0.4vw;
}

.in {
  font-size: var(--fs-item-name);
  color: var(--cream);
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inn {
  display: block;
  font-size: var(--fs-item-note);
  color: var(--muted);
  font-style: italic;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ip {
  font-size: var(--fs-price);
  font-weight: 600;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

.ip.np { color: color-mix(in srgb, var(--muted) 60%, transparent); }
.ip.r  { text-align: right; }

/* Grid price cells centered under their S/M/L column header */
.r3 .ip, .r2 .ip { text-align: center; }

/* ── Task 2.7: Badge styles ───────────────────────────────────────────────── */
/* Cold star — visible without colour via superscript position (FR-16) */
.best::after {
  content: '★';
  font-size: var(--fs-badge-star);
  color: var(--gold);
  margin-left: 8px;
  vertical-align: super;
}

/* NEW pill — amber background + uppercase text for colour-independent ID */
.new-badge {
  display: inline-block;
  background: var(--gold);
  color: var(--bg);
  font-size: var(--fs-badge-new);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.1em 0.6em;
  border-radius: 2px;
  margin-left: 8px;
  vertical-align: middle;
}

/* ── v3.0: Spacious template ──────────────────────────────────────────────── */
.sg {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

/* Flexbox: name+desc group left, price right */
.si {
  display: flex;
  align-items: center;
  gap: 3vw;
  padding: 2.5vh 0;
  border-bottom: 1px solid var(--border);
}

/* Left group wrapping name + optional desc */
.si-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.si-n {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: var(--fs-item-name);
  font-style: italic;
  color: var(--cream);
}

.si-d {
  font-size: var(--fs-item-note);
  color: var(--muted);
  font-style: italic;
  line-height: 1.5;
}

.si-p {
  flex-shrink: 0;
  font-size: var(--fs-price);
  font-weight: 700;
  color: var(--gold);
  white-space: nowrap;
}

/* ── v3.0: Featured-single ────────────────────────────────────────────────── */
.fs-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 4vh 6vw;
  text-align: center;
  gap: 2.5vh;
}

/* Gradient placeholder when no image is uploaded */
.fs-img-ph {
  width: 55vw;
  height: 42vh;
  background: linear-gradient(135deg, var(--panel), color-mix(in srgb, var(--border) 40%, var(--panel)));
  border-radius: 8px;
}

.fs-img-el {
  max-width: 55vw;
  max-height: 45vh;
  border-radius: 8px;
  object-fit: cover;
}

.fs-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 5.5vw;
  font-style: italic;
  font-weight: 700;
  color: var(--cream);
  line-height: 1.1;
}

.fs-note {
  font-size: 1.4vw;
  color: var(--muted);
  line-height: 1.65;
  max-width: 50vw;
}

.fs-price {
  font-size: 3.8vw;
  font-weight: 700;
  color: var(--goldLight);
  letter-spacing: 0.03em;
}

/* ── Full-image slide — one photo filling the screen ─────────────────────── */
.fi-wrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--bg);
}

/* Default: reach past the slide box so the photo covers the top bar and the
   bottom nav strip. The top bar is static, so the photo simply paints over it.
   .nav/.pb are fixed with z-index 10 and cannot be out-stacked from inside .ss
   — .ss is itself fixed, and Chrome makes every fixed element a stacking
   context — so they are faded out instead whenever a bleed slide is active.
   Browsers without :has() just keep the bar and strip visible. */
.fi-wrap.fi-bleed {
  top: -6.5vh;
  bottom: -46px;
}

body:has(.slide.active .fi-bleed) .tb,
body:has(.slide.active .fi-bleed) .nav,
body:has(.slide.active .fi-bleed) .pb {
  opacity: 0;
  pointer-events: none;
}

/* Fades in step with the 0.75 s slide crossfade. .pb is left out on purpose —
   its own rule sets transition:none so the progress width never animates. */
.tb, .nav { transition: opacity 0.75s ease-in-out; }

.fi-img {
  display: block;
  width: 100%;
  height: 100%;
}

.fi-img.fi-cover   { object-fit: cover; }
.fi-img.fi-contain { object-fit: contain; }

.fi-ph {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3vw;
  letter-spacing: 0.1em;
  color: var(--muted);
  background: linear-gradient(135deg, var(--panel), color-mix(in srgb, var(--border) 40%, var(--panel)));
}

/* Signature badge — shown when item.isFeatured === true on featured-single */
.fb-tag {
  position: absolute;
  top: 2vh;
  right: 0;
  background: var(--gold);
  color: var(--bg);
  font-size: var(--fs-badge-featured);
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 0.4em 1.2em;
  border-radius: 4px 0 0 4px;
}

/* Campaign badge — shown when item.isCampaign === true on featured-single */
.fb-campaign-tag {
  position: absolute;
  top: 2vh;
  left: 0;
  background: #c0392b;
  color: #fff;
  font-size: var(--fs-badge-campaign);
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 0.4em 1.2em;
  border-radius: 0 4px 4px 0;
}

/* ── v3.0: Featured-quad ──────────────────────────────────────────────────── */
.fq-wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 3vh 4vw;
  gap: 2vh;
}

.fq-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2.5vw;
  flex: 1;
}

.fq-card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

/* Image area — fixed aspect ratio placeholder */
.fq-img-ph {
  flex: 1;
  min-height: 22vh;
  background: linear-gradient(135deg, var(--panel), color-mix(in srgb, var(--border) 50%, var(--panel)));
}

.fq-img-el {
  width: 100%;
  height: 26vh;
  object-fit: cover;
}

.fq-info {
  padding: 1.2vh 1.5vw 1.5vh;
  display: flex;
  flex-direction: column;
  gap: 0.5vh;
}

.fq-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 2.8vw;
  font-style: italic;
  color: var(--cream);
  line-height: 1.2;
}

.fq-price {
  font-size: 2.8vw;
  font-weight: 700;
  color: var(--gold);
}

/* ── Task 2.11: Addon-cards ───────────────────────────────────────────────── */
/* Single-column vertical list — each card is a horizontal row on portrait TV */
.addon-wrap {
  display: flex;
  flex-direction: column;
  gap: 2.5vh;
  flex: 1;
  justify-content: center;
}

.ac {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 3vw;
  padding: 2.8vh 2.5vw;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--gold);
  border-radius: 4px;
}

.ac-icon {
  font-size: 3.5vw;
  flex-shrink: 0;
  width: 5vw;
  text-align: center;
}

.ac-body {
  flex: 1;
  display: flex;
  flex-direction: column;

  border-radius: 4px;

  top: 6.5vh;
  left: 0; right: 0;
  bottom: 46px;

  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;

  transition: opacity 0.75s ease-in-out;
  pointer-events: none;

.slide.active {
  opacity: 1;
  pointer-events: auto;
}

  position: fixed;
  bottom: 46px;
  left: 0;
  height: 2px;
  width: 0%;
  background: var(--gold);

  z-index: 10;

  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--surface);
  z-index: 10;

  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
